# Mitgelieferter Reverse Proxy (Profil "proxy").
# HTTPS: Zertifikate als deploy/nginx/certs/fullchain.pem + privkey.pem ablegen und den auskommentierten
# server-Block unten aktivieren (und im ersten Block auf HTTPS umleiten).

upstream wt_app {
    server app:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    # return 301 https://$host$request_uri;   # aktivieren, sobald HTTPS eingerichtet ist

    location / {
        proxy_pass http://wt_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

