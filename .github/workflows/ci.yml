name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt httpx
      - run: python -m pytest -q
        working-directory: server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen und Stack starten
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password/' .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-secret-key-ci-secret-key-ci-secret-key/' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password-1/' .env
          docker compose up -d --build
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:8000/api/health && break
            sleep 3
          done
          curl -fs http://127.0.0.1:8000/api/health
          curl -fs -o /dev/null http://127.0.0.1:8000/
          curl -fs -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password-1"}' http://127.0.0.1:8000/api/auth/login
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color
